<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Product review form for WDD 131 - Dynamic Web Fundamentals.">
    <meta name="author" content="Charina Pahia">

    <title>Product Review | Charina Pahia</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <label for="rating1">
                        <span>1</span>
                        <span>&star;</span>
                    </label>
                    <input type="radio" id="rating1" name="rating" value="1" required>

                    <label for="rating2">
                        <span>2</span>
                        <span>&star;</span>
                    </label>
                    <input type="radio" id="rating2" name="rating" value="2" required>

                    <label for="rating3">
                        <span>3</span>
                        <span>&star;</span>
                    </label>
                    <input type="radio" id="rating3" name="rating" value="3" required>

                    <label for="rating4">
                        <span>4</span>
                        <span>&star;</span>
                    </label>
                    <input type="radio" id="rating4" name="rating" value="4" required>

                    <label for="rating5">
                        <span>5</span>
                        <span>&star;</span>
                    </label>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <label for="installation">Date of Installation</label>
            <input type="date" id="installation" name="installation" required>

            <!-- Useful Features -->
            <fieldset>
                <legend>Which features did you find useful? <span>(Check all that apply)</span></legend>

                <label>
                    <input type="checkbox" id="durability" name="features" value="durability">
                    Durability
                </label>

                <label>
                    <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                    Ease of Use
                </label>

                <label>
                    <input type="checkbox" id="performance" name="features" value="performance">
                    Performance
                </label>

                <label>
                    <input type="checkbox" id="design" name="features" value="design">
                    Design
                </label>
            </fieldset>

            <!-- Written Review -->
            <label for="review">Written Review <span>(Optional)</span></label>
            <textarea id="review" name="review" rows="6"></textarea>

            <!-- User Name -->
            <label for="username">Your Name <span>(Optional)</span></label>
            <input type="text" id="username" name="username">

            <!-- Submit -->
            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> 🌺 Charina Pahia 🌺 California
        </p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
